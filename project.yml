name: SkillHub
options:
  bundleIdPrefix: dev.lucy
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    # Switch to 8YVWX4U62Y to publish from the rowoverz@gmail.com team instead.
    DEVELOPMENT_TEAM: 6GBW9525BT
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEAD_CODE_STRIPPING: YES

targets:
  SkillHub:
    type: application
    platform: macOS
    sources:
      - path: SkillHub
        excludes:
          - "Info.plist"
          - "SkillHub.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lucy.SkillHub
        PRODUCT_NAME: Skill Hub
        PRODUCT_MODULE_NAME: SkillHub
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: SkillHub/Info.plist
        CODE_SIGN_ENTITLEMENTS: SkillHub/SkillHub.entitlements
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    scheme:
      testTargets:
        - SkillHubTests
      gatherCoverageData: true

  SkillHubTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SkillHubTests
    dependencies:
      - target: SkillHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lucy.SkillHubTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        # The app's product name has a space, so point the test host at it explicitly.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Skill Hub.app/Contents/MacOS/Skill Hub"
        BUNDLE_LOADER: "$(TEST_HOST)"
